<!doctype html>
<html lang="en" style="color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO & Google Search Console Tags -->
    <meta name="google-site-verification" content="9dkNVHJHn4g5Xx6rn3aqnyMDQXKiXxotrQwO1eLc4rI" />
    <title>AeroDispatch — AI-Powered Smart Logistics & Express Consignment Tracking</title>
    <meta name="description" content="AeroDispatch is an enterprise cloud logistics and dispatch platform featuring real-time Air Waybill (AWB) tracking, automated driver run sheets, and verified electronic Proof of Delivery (e-POD)." />
    <meta name="keywords" content="logistics platform, express air dispatch, AWB consignment tracking, proof of delivery, delivery run sheets, supply chain tracking, aerodispatch" />
    <meta name="author" content="AeroDispatch Technologies" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://aerodispatch.site/" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aerodispatch.site/" />
    <meta property="og:title" content="AeroDispatch — Smart Logistics & Express Dispatch" />
    <meta property="og:description" content="Enterprise logistics management, live AWB package tracking, courier run sheets, and verified e-POD." />
    <meta property="og:site_name" content="AeroDispatch" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://aerodispatch.site/" />
    <meta name="twitter:title" content="AeroDispatch — Smart Logistics Platform" />
    <meta name="twitter:description" content="Live AWB package tracking, fleet dispatch, and electronic proof of delivery." />

    <!-- Structured Data (Schema.org JSON-LD for Googlebot) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LogisticsService",
      "name": "AeroDispatch",
      "url": "https://aerodispatch.site",
      "logo": "https://aerodispatch.site/favicon.svg",
      "description": "Enterprise smart logistics management, live AWB consignment tracking, and verified Proof of Delivery.",
      "serviceType": "Express Consignment & Freight Logistics",
      "areaServed": "Global",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://aerodispatch.site/tracking?awb={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Modern Typography: Plus Jakarta Sans for clean UI & JetBrains Mono for AWB numbers -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
